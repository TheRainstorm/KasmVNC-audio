<!DOCTYPE html><html><head><meta charset="utf-8"><title>worklet silent input</title></head>
<body><div id="status">loading</div>
<script>
window.addEventListener('load', function () {
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx = new Ctx();
  var src = "class P extends AudioWorkletProcessor{constructor(){super();this.calls=0;this.buf=new Float32Array(0);this.port.onmessage=(e)=>{var d=e.data;var nb=new Float32Array(this.buf.length+d.length);nb.set(this.buf);nb.set(d,this.buf.length);this.buf=nb}}process(i,o){this.calls++;if(this.calls%500===0){this.port.postMessage({calls:this.calls})}var c0=o[0],c1=o[1],n=c0.length;if(this.buf.length>=n*2){var pi=0;for(var j=0;j<n;j++){c0[j]=this.buf[pi];c1[j]=this.buf[pi+1];pi+=2}this.buf=this.buf.subarray(n*2)}else{c0.fill(0);c1.fill(0)}return true}}registerProcessor('kasm-pcm',P);";
  var an = ctx.createAnalyser();
  an.fftSize = 2048;
  an.connect(ctx.destination);
  var msgs = [];
  function report(tag) {
    var buf = new Uint8Array(an.frequencyBinCount);
    an.getByteTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
    var rms = Math.sqrt(sum / buf.length);
    var db = rms > 0.0001 ? Math.round(20 * Math.log10(rms)) : -999;
    document.getElementById('status').textContent = tag + ' db=' + db + ' ctx=' + ctx.state + ' | msgs=' + msgs.join(';');
  }
  ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })))
    .then(function () {
      var wn = new AudioWorkletNode(ctx, 'kasm-pcm', { outputChannelCount: [2], numberOfOutputs: 1, numberOfInputs: 1 });
      wn.port.onmessage = function (e) { msgs.push(JSON.stringify(e.data)); };
      var silent = ctx.createConstantSource();
      silent.offset.value = 0;
      silent.connect(wn);
      silent.start();
      wn.connect(an);
      var phase = 0;
      var timer = setInterval(function () {
        var f = new Float32Array(8192);
        for (var i = 0; i < f.length; i++) { phase += 0.1; f[i] = Math.sin(phase) * 0.5; }
        wn.port.postMessage(f, [f.buffer]);
      }, 40);
      setTimeout(function () { clearInterval(timer); report('silent+port'); }, 2500);
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'addModule FAIL: ' + e;
    });
});
</script>
</body></html>
