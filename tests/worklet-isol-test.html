<!DOCTYPE html><html><head><meta charset="utf-8"><title>worklet isol test</title></head>
<body><div id="status">loading</div>
<script>
window.addEventListener('load', function () {
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx = new Ctx();
  var src = "class P extends AudioWorkletProcessor{constructor(){super();this.calls=0;this.port.onmessage=(e)=>{this.port.postMessage({got:true,len:e.data&&e.data.length!==undefined?e.data.length:'?',type:Object.prototype.toString.call(e.data)})}}process(i,o){this.calls++;if(this.calls%1000===0){this.port.postMessage({calls:this.calls})}var c0=o[0],c1=o[1];for(var j=0;j<c0.length;j++){c0[j]=0.5;c1[j]=0.5}return true}}registerProcessor('kasm-pcm',P);";
  var an = ctx.createAnalyser();
  an.fftSize = 2048;
  an.connect(ctx.destination);
  var msgs = [];
  function report(tag) {
    var buf = new Uint8Array(an.frequencyBinCount);
    an.getByteTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
    var rms = Math.sqrt(sum / buf.length);
    var db = rms > 0.0001 ? Math.round(20 * Math.log10(rms)) : -999;
    document.getElementById('status').textContent = tag + ' db=' + db + ' ctx=' + ctx.state + ' | msgs=' + msgs.join(';');
  }
  ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })))
    .then(function () {
      var wn = new AudioWorkletNode(ctx, 'kasm-pcm', { outputChannelCount: [2], numberOfOutputs: 1, numberOfInputs: 1 });
      wn.connect(an);
      wn.port.onmessage = function (e) {
        msgs.push(JSON.stringify(e.data));
      };
      var f = new Float32Array(8);
      for (var i = 0; i < 8; i++) f[i] = 0.25;
      wn.port.postMessage(f, [f.buffer]);
      setTimeout(function () { report('const->worklet'); }, 1500);
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'addModule FAIL: ' + e;
    });
});
</script>
</body></html>
