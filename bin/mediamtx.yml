logLevel: debug
rtsp: false
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8188
webrtcIPsFromInterfaces: false
# 运行配置由 deploy/install.sh 生成到 ~/.vnc/mediamtx.yml（不入 git），
# webrtcAdditionalHosts 会被替换为服务器 LAN IP —— 跨机 WHEP 必须通告可路由地址；
# 自动探测不灵时用 KASM_AUDIO_LAN_IP 环境变量覆盖后重跑 install.sh。
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []

# 本地 API：供 whip-watchdog 检查发布状态（仅监听回环）
api: yes
apiAddress: 127.0.0.1:9997
paths:
  all_others:
    source: publisher
